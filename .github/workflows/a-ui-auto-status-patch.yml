name: One-time A UI Auto Status Patch

on:
  push:
    paths:
      - '.github/workflows/a-ui-auto-status-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump A UI auto-status resources
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai-assistant.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('a-ui-layout-fix.css?v=20260812-a-sidebar-fix-1','a-ui-layout-fix.css?v=20260812-a-auto-status-1')
          s=s.replace('a-ui-category-tools.js?v=20260812-a-organize-1','a-ui-category-tools.js?v=20260812-a-auto-status-1')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/a-ui-auto-status-patch.yml
          git add ai-assistant.html
          git commit -m "feat(video): ship automatic clip finalization grouping"
          git push origin main
