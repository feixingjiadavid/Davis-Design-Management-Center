name: Davis Video A UI Direct Entry Hotfix

on:
  push:
    paths:
      - '.github/workflows/a-ui-direct-entry-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch ai-assistant direct A entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ai-assistant.html')
          s = p.read_text(encoding='utf-8')
          old = '  <script type="module" src="./seedance/ui-patches.js?v=20260724-davis-video-ui-v1"></script>'
          new = '  <script type="module" src="./supabase-config.js?v=20260812-a-ui-mount"></script>\n  <script type="module" src="./seedance/ui-patches.js?v=20260812-a-ui-direct-entry-1"></script>'
          if old not in s:
              raise SystemExit('expected old ui-patches script tag not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify direct entry
        shell: bash
        run: |
          grep -F './supabase-config.js?v=20260812-a-ui-mount' ai-assistant.html
          grep -F './seedance/ui-patches.js?v=20260812-a-ui-direct-entry-1' ai-assistant.html
          node --test seedance/a-ui-mount.test.mjs seedance/a-version-regression.test.mjs

      - name: Commit hotfix and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-assistant.html
          git rm -f .github/workflows/a-ui-direct-entry-hotfix.yml
          git commit -m 'fix(video): force direct A UI bootstrap and cache bust'
          git push
