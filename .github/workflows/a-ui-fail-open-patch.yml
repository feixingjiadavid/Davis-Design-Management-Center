name: One-time A UI Fail Open Patch

on:
  push:
    branches:
      - fix/a-ui-fail-open

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/a-ui-fail-open
      - name: Patch direct bootstrap into page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai-assistant.html')
          s=p.read_text(encoding='utf-8')
          old='  <script type="module" src="./supabase-config.js?v=20260812-a-ui-mount"></script>\n  <script type="module" src="./seedance/ui-patches.js?v=20260812-a-ui-direct-entry-1"></script>'
          new='  <script type="module" src="./supabase-config.js?v=20260812-a-ui-fail-open-2"></script>\n  <script type="module" src="./seedance/a-ui-direct-bootstrap.js?v=20260812-a-ui-fail-open-1"></script>\n  <script type="module" src="./seedance/ui-patches.js?v=20260812-a-ui-fail-open-2"></script>'
          if old not in s and 'a-ui-direct-bootstrap.js?v=20260812-a-ui-fail-open-1' not in s:
              raise SystemExit('expected script block not found')
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'a-ui-direct-bootstrap.js?v=20260812-a-ui-fail-open-1' ai-assistant.html
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/a-ui-fail-open-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai-assistant.html .github/workflows/a-ui-fail-open-patch.yml
          git commit -m 'fix(video): force A UI fail-open bootstrap on page'
          git push origin HEAD:fix/a-ui-fail-open
