name: One-time A Final Sidebar Publish
on:
  push:
    paths:
      - '.github/workflows/a-ui-final-layout-publish.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify A UI scripts
        run: |
          node --check seedance/a-ui-category-tools.js
          node --check seedance/a-ui-direct-bootstrap.js
      - name: Cache bust final A resources
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai-assistant.html')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'./seedance/a-ui-layout-fix\.css\?v=[^"\']+', './seedance/a-ui-layout-fix.css?v=20260812-a-final-layout-2', s)
          s=re.sub(r'./seedance/a-ui-category-tools\.js\?v=[^"\']+', './seedance/a-ui-category-tools.js?v=20260812-a-final-status-2', s)
          p.write_text(s, encoding='utf-8')
          PY
          grep -F 'a-ui-layout-fix.css?v=20260812-a-final-layout-2' ai-assistant.html
          grep -F 'a-ui-category-tools.js?v=20260812-a-final-status-2' ai-assistant.html
      - name: Remove one-time workflow
        run: rm .github/workflows/a-ui-final-layout-publish.yml
      - name: Commit final publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-assistant.html .github/workflows/a-ui-final-layout-publish.yml
          git commit -m 'fix(video): publish final A status layout' || exit 0
          git push origin main
