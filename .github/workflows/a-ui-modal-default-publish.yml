name: One-time A Modal Default Publish
on:
  push:
    paths:
      - '.github/workflows/a-ui-modal-default-publish.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch native create modal behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('seedance/app.js')
          s=p.read_text(encoding='utf-8')
          old="preferred = incoming || suggested || '其他';"
          if old not in s:
              raise SystemExit('category default pattern not found')
          s=s.replace(old,"preferred = incoming || suggested || values[0] || '其他';",1)
          old_parent="if ($('project-mode-modal')) $('project-mode-modal').onclick = event => { if (event.target === $('project-mode-modal')) r49CloseParentModal(); };"
          new_parent="if ($('project-mode-modal')) $('project-mode-modal').onclick = event => { if (event.target === $('project-mode-modal')) { event.preventDefault(); event.stopPropagation(); } };"
          if old_parent not in s:
              raise SystemExit('parent backdrop close pattern not found')
          s=s.replace(old_parent,new_parent,1)
          old_child="if ($('child-task-modal')) $('child-task-modal').onclick = event => { if (event.target === $('child-task-modal')) r49CloseChildTaskModal(); };"
          new_child="if ($('child-task-modal')) $('child-task-modal').onclick = event => { if (event.target === $('child-task-modal')) { event.preventDefault(); event.stopPropagation(); } };"
          if old_child not in s:
              raise SystemExit('child backdrop close pattern not found')
          s=s.replace(old_child,new_child,1)
          old_escape="window.addEventListener('keydown',event => { if (event.key === 'Escape') { if (usageModal && !usageModal.hidden) closeUsage(); if ($('child-task-modal') && !$('child-task-modal').hidden) r49CloseChildTaskModal(); if ($('project-mode-modal') && !$('project-mode-modal').hidden) r49CloseParentModal(); } });"
          new_escape="window.addEventListener('keydown',event => { if (event.key === 'Escape' && usageModal && !usageModal.hidden) closeUsage(); });"
          if old_escape not in s:
              raise SystemExit('escape close pattern not found')
          s=s.replace(old_escape,new_escape,1)
          p.write_text(s,encoding='utf-8')
          html=Path('ai-assistant.html')
          h=html.read_text(encoding='utf-8')
          h=re.sub(r'app\.js\?v=[^"\']+', 'app.js?v=20260812-safe-create-modal-r51', h, count=1)
          h=re.sub(r'a-ui-layout-fix\.css\?v=[^"\']+', 'a-ui-layout-fix.css?v=20260812-a-right-status-7', h)
          h=re.sub(r'a-ui-category-tools\.js\?v=[^"\']+', 'a-ui-category-tools.js?v=20260812-a-right-status-7', h)
          h=re.sub(r'ui-patches\.js\?v=[^"\']+', 'ui-patches.js?v=20260812-project-modal-guard-1', h)
          html.write_text(h,encoding='utf-8')
          PY
          rm .github/workflows/a-ui-modal-default-publish.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add seedance/app.js ai-assistant.html .github/workflows/a-ui-modal-default-publish.yml
          git commit -m "fix(video): preserve create forms and default first project category"
          git push
