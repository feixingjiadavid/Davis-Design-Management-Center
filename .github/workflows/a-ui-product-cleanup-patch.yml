name: One-time A UI Product Cleanup Patch
on:
  push:
    paths:
      - '.github/workflows/a-ui-product-cleanup-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch A UI source and verify
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('seedance/r54-deliverables.js')
          s = p.read_text(encoding='utf-8')

          s = s.replace('<strong>未归类</strong>', '<strong>其他任务</strong>')
          s = s.replace('已通过 ${counts.accepted}', '定版 ${counts.accepted}')
          s = s.replace('已通过 ${c.accepted}', '定版 ${c.accepted}')

          pattern = r"function renderContext\(\)\{.*?\}\nfunction renderSummary\(\)"
          repl = r'''function renderContext(){
  const host=$('child-task-context');
  if(!host)return;
  let extra=$('r54-context-extra');
  if(!extra){extra=document.createElement('span');extra.id='r54-context-extra';host.appendChild(extra);}
  const draft=currentDraft();
  if(!draft){extra.innerHTML='';extra.dataset.localId='';return;}
  const meta=draftMeta(draft),localId=String(draft.id),normalized=meta.reviewStatus==='pending_review'?'draft':meta.reviewStatus;
  if(extra.dataset.localId!==localId || !$('[data-r54-review-select]',extra)){
    extra.dataset.localId=localId;
    extra.innerHTML=`<label class="r54-review-control"><span>状态</span><select data-r54-review-select data-local-id="${esc(localId)}" aria-label="当前任务状态"><option value="draft">草稿</option><option value="accepted">定版</option><option value="backup">备用</option><option value="needs_retry">需重做</option><option value="rejected">废弃</option></select></label>`;
  }
  const select=$('[data-r54-review-select]',extra);
  if(select && document.activeElement!==select) select.value=normalized;
}
function renderSummary()'''
          s, n = re.subn(pattern, repl, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'renderContext replacement failed: {n}')

          old = "if(!ids.length)return toast('请先勾选任务','批量生成只处理你明确勾选的任务。');"
          new = "if(!ids.length){const node=[...document.querySelectorAll('.r54-deliverable')].find(n=>String(n.dataset.deliverable||'')===String(did));node?.classList.add('r54-batch-selecting');return toast('选择要批量生成的任务','勾选需要生成的任务后，再点一次“批量生成”。');}"
          if old in s:
              s = s.replace(old, new)

          old_finally = "finally{state.executingBatch=false;state.cancelBatch=false;}"
          new_finally = "finally{state.executingBatch=false;state.cancelBatch=false;document.querySelectorAll('.r54-batch-selecting').forEach(n=>n.classList.remove('r54-batch-selecting'));}"
          if old_finally in s:
              s = s.replace(old_finally, new_finally)

          if "draft.reviewStatus='pending_review'" in s:
              raise SystemExit('automatic review status transition still present')
          if '未归类</strong>' in s:
              raise SystemExit('user-facing unclassified label still present')

          p.write_text(s, encoding='utf-8')

          html = Path('ai-assistant.html')
          h = html.read_text(encoding='utf-8')
          h = re.sub(r'a-ui-layout-fix\.css\?v=[^"\']+', 'a-ui-layout-fix.css?v=20260812-a-product-cleanup-1', h)
          h = re.sub(r'a-ui-category-tools\.js\?v=[^"\']+', 'a-ui-category-tools.js?v=20260812-a-product-cleanup-1', h)
          h = re.sub(r'supabase-config\.js\?v=[^"\']+', 'supabase-config.js?v=20260812-a-product-cleanup-1', h)
          html.write_text(h, encoding='utf-8')
          PY

          node --check seedance/r54-deliverables.js
          node --check seedance/a-ui-category-tools.js
          grep -q 'data-r54-review-select' seedance/r54-deliverables.js
          ! grep -q "draft.reviewStatus='pending_review'" seedance/r54-deliverables.js
          ! grep -q 'a-clip-status-select' seedance/a-ui-category-tools.js

          rm .github/workflows/a-ui-product-cleanup-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add seedance/r54-deliverables.js ai-assistant.html .github/workflows/a-ui-product-cleanup-patch.yml
          git commit -m "fix(video): restore clear A project manager UX"
          git push
