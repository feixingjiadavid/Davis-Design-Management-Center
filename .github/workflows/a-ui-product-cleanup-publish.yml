name: One-time A UI Product Cleanup Publish
on:
  push:
    paths:
      - '.github/workflows/a-ui-product-cleanup-publish.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump Davis Video frontend resources
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('ai-assistant.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            r'a-ui-layout-fix\.css\?v=[^"\']+': 'a-ui-layout-fix.css?v=20260812-a-product-cleanup-2',
            r'a-ui-category-tools\.js\?v=[^"\']+': 'a-ui-category-tools.js?v=20260812-a-product-cleanup-2',
            r'supabase-config\.js\?v=[^"\']+': 'supabase-config.js?v=20260812-a-product-cleanup-2',
            r'app\.js\?v=[^"\']+': 'app.js?v=20260812-a-product-cleanup-2',
          }
          for pattern, value in replacements.items():
              s, n = re.subn(pattern, value, s, count=1)
              if n != 1:
                  raise SystemExit(f'failed to bump {pattern}: {n}')
          p.write_text(s, encoding='utf-8')
          PY
          node --check seedance/a-ui-category-tools.js
          node --check seedance/app.js
          rm .github/workflows/a-ui-product-cleanup-publish.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai-assistant.html .github/workflows/a-ui-product-cleanup-publish.yml
          git commit -m "chore(video): activate A UI product cleanup resources"
          git push
