name: One-time A Right Status Source Publish
on:
  push:
    paths:
      - '.github/workflows/a-ui-right-status-source-publish.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch R54 status ownership and publish resources
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('seedance/r54-deliverables.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("accepted:'已通过'", "accepted:'定版'")
          auto="if(meta.reviewStatus==='draft' && segments.length && segments.every(s=>['succeeded','completed','success'].includes(String(s.status||'').toLowerCase()))){draft.reviewStatus='pending_review';draft.review_status='pending_review';await saveDraft(draft);changed=true;}"
          if auto not in s:
              raise SystemExit('auto review transition pattern not found')
          s=s.replace(auto, "")
          pattern=r"function renderContext\(\)\{.*?\}\nfunction renderSummary\(\)"
          repl=r'''function renderContext(){
  const host=$('child-task-context'); if(!host)return;
  let extra=$('r54-context-extra');
  if(!extra){extra=document.createElement('span');extra.id='r54-context-extra';host.appendChild(extra);}
  const draft=currentDraft();
  if(!draft){extra.innerHTML='';extra.dataset.localId='';return;}
  const meta=draftMeta(draft),d=meta.deliverableId?state.deliverableById.get(meta.deliverableId):null;
  const localId=String(draft.id), normalized=meta.reviewStatus==='pending_review'?'draft':meta.reviewStatus;
  if(extra.dataset.localId!==localId || !$('[data-r54-review-select]',extra)){
    extra.dataset.localId=localId;
    extra.innerHTML=`<span class="r54-chip">${esc(d?.name||'未分配成片单元')}</span>${meta.subjectKey?`<span class="r54-chip">${esc(meta.subjectKey)}</span>`:''}<span class="r54-chip">第 ${meta.attemptNo} 次</span><label class="r54-review-control"><span>状态</span><select data-r54-review-select data-local-id="${esc(localId)}"><option value="draft">草稿</option><option value="accepted">定版</option><option value="backup">备用</option><option value="needs_retry">需重做</option><option value="rejected">废弃</option></select></label>${meta.deliverableId?`<span class="r54-context-actions"><button data-r54-retry="${esc(localId)}">重新生成草稿</button></span>`:''}`;
  }
  const select=$('[data-r54-review-select]',extra);
  if(select && document.activeElement!==select) select.value=normalized;
}
function renderSummary()'''
          s2,n=re.subn(pattern,repl,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'renderContext replace count {n}')
          s=s2
          old="document.addEventListener('change',event=>{const t=event.target.closest?.('[data-r54-task-check]');if(t){const id=String(t.dataset.r54TaskCheck);t.checked?state.selectedTaskIds.add(id):state.selectedTaskIds.delete(id);}});"
          new="document.addEventListener('change',event=>{const review=event.target.closest?.('[data-r54-review-select]');if(review){event.stopPropagation();const localId=review.dataset.localId,next=review.value;review.disabled=true;void setReview(localId,next).then(()=>{document.dispatchEvent(new CustomEvent('davis-video-review-status-changed',{detail:{localId,status:next}}));renderContext();}).finally(()=>{review.disabled=false;});return;}const t=event.target.closest?.('[data-r54-task-check]');if(t){const id=String(t.dataset.r54TaskCheck);t.checked?state.selectedTaskIds.add(id):state.selectedTaskIds.delete(id);}});"
          if old not in s:
              raise SystemExit('change handler pattern not found')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          html=Path('ai-assistant.html')
          h=html.read_text(encoding='utf-8')
          h=re.sub(r'a-ui-layout-fix\.css\?v=[^"\']+', 'a-ui-layout-fix.css?v=20260812-a-right-status-6', h)
          h=re.sub(r'a-ui-category-tools\.js\?v=[^"\']+', 'a-ui-category-tools.js?v=20260812-a-right-status-6', h)
          h=re.sub(r'ui-patches\.js\?v=[^"\']+', 'ui-patches.js?v=20260812-project-modal-guard-1', h)
          html.write_text(h,encoding='utf-8')
          PY
          rm .github/workflows/a-ui-right-status-source-publish.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add seedance/r54-deliverables.js ai-assistant.html .github/workflows/a-ui-right-status-source-publish.yml
          git commit -m "fix(video): make top context the only review status editor"
          git push
