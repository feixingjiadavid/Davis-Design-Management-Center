name: One-time A Single Status Publish
on:
  push:
    paths:
      - '.github/workflows/a-ui-single-status-publish.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update resource versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai-assistant.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('a-ui-layout-fix.css?v=20260812-a-stacked-card-3','a-ui-layout-fix.css?v=20260812-a-single-status-4')
          s=s.replace('a-ui-category-tools.js?v=20260812-a-final-status-2','a-ui-category-tools.js?v=20260812-a-single-status-4')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit publish patch and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai-assistant.html
          git rm .github/workflows/a-ui-single-status-publish.yml
          git commit -m 'fix(video): publish single authoritative clip status control'
          git push origin main
