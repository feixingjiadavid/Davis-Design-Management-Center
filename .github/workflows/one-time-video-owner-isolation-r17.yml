name: One-time Video Owner Isolation R17

"on":
  push:
    branches:
      - fix/video-owner-isolation-new-draft-r17
    paths:
      - scripts/patch_video_owner_isolation_r17.py
      - .github/workflows/one-time-video-owner-isolation-r17.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/video-owner-isolation-new-draft-r17
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply owner isolation patch
        run: python scripts/patch_video_owner_isolation_r17.py
      - name: Syntax check
        run: |
          node --check seedance/app.js
          node --check seedance/r54-deliverables.js
          node --check seedance/access-control.mjs
      - name: Regression tests
        run: |
          node --test seedance/access-control.test.mjs seedance/owner-isolation-regression.test.mjs
          node --test seedance/r54-deliverables-core.test.mjs seedance/r54-import-normalization.test.mjs seedance/a-version-regression.test.mjs seedance/a-ui-mount.test.mjs seedance/r12-1-regression.test.mjs seedance/r12-2-status-regression.test.mjs seedance/r12-3-status-binding-regression.test.mjs
      - name: Commit runtime fix
        run: |
          git config user.name "feixingjiadavid"
          git config user.email "139209569+feixingjiadavid@users.noreply.github.com"
          git add seedance/app.js seedance/r54-deliverables.js seedance/a-ui-layout-fix.css seedance/access-control.mjs seedance/access-control.test.mjs seedance/owner-isolation-regression.test.mjs ai-assistant.html supabase-config.js .github/workflows/r54-check.yml
          git diff --cached --check
          git commit -m "fix(video): isolate every account and restore own upload/generation flow" || exit 0
          git push origin HEAD:fix/video-owner-isolation-new-draft-r17
