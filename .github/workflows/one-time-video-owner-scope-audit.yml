name: One-time Video Owner Scope Audit

"on":
  push:
    branches:
      - fix/video-owner-isolation-new-draft-r17
    paths:
      - .github/workflows/one-time-video-owner-scope-audit.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/video-owner-isolation-new-draft-r17
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Force current-account project read scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('seedance/app.js')
          s=p.read_text()
          old="""function r16ScopeProjectRead(query, draft = state.draft) {
            const ownerId = r16ProjectOwnerId(draft);
            return ownerId ? query.eq('owner_id', ownerId) : scopeVideoRead(query, state.user);
          }
          """
          new="""function r16ScopeProjectRead(query, draft = state.draft) {
            return scopeVideoRead(query, state.user);
          }
          """
          if s.count(old)!=1:
              raise SystemExit(f'expected one r16ScopeProjectRead block, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify
        run: |
          node --check seedance/app.js
          node --test seedance/access-control.test.mjs seedance/owner-isolation-regression.test.mjs
      - name: Commit
        run: |
          git config user.name "feixingjiadavid"
          git config user.email "139209569+feixingjiadavid@users.noreply.github.com"
          git add seedance/app.js seedance/owner-isolation-regression.test.mjs
          git diff --cached --check
          git commit -m "fix(video): force current-account scope for project reads"
          git push origin HEAD:fix/video-owner-isolation-new-draft-r17
