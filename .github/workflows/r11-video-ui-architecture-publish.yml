name: One-time Video UI R11 Architecture Publish
on:
  push:
    branches:
      - fix/video-ui-r11-architecture-20260812
permissions:
  contents: write
jobs:
  publish:
    if: "!contains(github.event.head_commit.message, '[r11-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/video-ui-r11-architecture-20260812
      - name: Remove tree rebuild from review save and bump assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('seedance/r54-deliverables.js')
          s = p.read_text(encoding='utf-8')
          old = "await loadData();document.querySelectorAll('.project-child-list').forEach(x=>delete x.dataset.r54);queueEnhance();"
          new = "const cloud=rid?state.projectById.get(String(rid)):null;if(cloud)cloud.review_status=next;"
          if old not in s:
              raise SystemExit('setReview tree-rebuild tail not found')
          s = s.replace(old, new, 1)
          s = s.replace("'未归类'", "'默认成片单元'")
          p.write_text(s, encoding='utf-8')

          sp = Path('supabase-config.js')
          x = sp.read_text(encoding='utf-8')
          x = re.sub(r"import\('\./seedance/r54-deliverables\.js(?:\?v=[^']*)?'\)", "import('./seedance/r54-deliverables.js?v=20260812-r11-state-1')", x)
          sp.write_text(x, encoding='utf-8')

          hp = Path('ai-assistant.html')
          h = hp.read_text(encoding='utf-8')
          h = re.sub(r'a-ui-layout-fix\.css\?v=[^\"\']+', 'a-ui-layout-fix.css?v=20260812-r11-architecture-1', h)
          h = re.sub(r'a-ui-category-tools\.js\?v=[^\"\']+', 'a-ui-category-tools.js?v=20260812-r11-architecture-1', h)
          h = re.sub(r'supabase-config\.js\?v=[^\"\']+', 'supabase-config.js?v=20260812-r11-architecture-1', h)
          hp.write_text(h, encoding='utf-8')
          PY
          rm -f .github/workflows/r11-video-ui-architecture-publish.yml
      - name: Verify syntax and regression suite
        run: |
          node --check seedance/a-ui-category-tools.js
          node --check seedance/r54-deliverables.js
          node --check supabase-config.js
          node --test seedance/r54-deliverables-core.test.mjs seedance/r54-import-normalization.test.mjs seedance/a-version-regression.test.mjs seedance/a-ui-mount.test.mjs
      - name: Commit R11 implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add seedance/r54-deliverables.js seedance/a-ui-category-tools.js seedance/a-ui-layout-fix.css supabase-config.js ai-assistant.html seedance/a-version-regression.test.mjs .github/workflows/r11-video-ui-architecture-publish.yml
          git commit -m 'fix(video): R11 event-driven review architecture [r11-done]'
          git push origin HEAD:fix/video-ui-r11-architecture-20260812
