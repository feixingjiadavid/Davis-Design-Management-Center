name: R12.2 Status UI Verify

"on":
  push:
    branches:
      - fix/video-ui-r12-2-status-colors-20260812

permissions:
  contents: write

jobs:
  verify-and-bust-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/video-ui-r12-2-status-colors-20260812
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache bust status UI assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('ai-assistant.html')
          s=p.read_text()
          s=re.sub(r'a-ui-layout-fix\.css\?v=[^"\']+', 'a-ui-layout-fix.css?v=20260812-r12-2-status-colors-1', s)
          s=re.sub(r'a-ui-category-tools\.js\?v=[^"\']+', 'a-ui-category-tools.js?v=20260812-r12-2-status-colors-1', s)
          p.write_text(s)
          PY

      - name: Verify syntax and regressions
        run: |
          node --check seedance/a-ui-category-tools.js
          node --test seedance/r12-2-status-regression.test.mjs seedance/r12-1-regression.test.mjs seedance/a-version-regression.test.mjs seedance/a-ui-mount.test.mjs seedance/r54-deliverables-core.test.mjs seedance/r54-import-normalization.test.mjs
          git diff --check

      - name: Commit cache bust when changed
        run: |
          if git diff --quiet; then
            echo "No cache-bust changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-assistant.html
          git commit -m "chore(video): publish R12.2 status color assets"
          git push origin HEAD:fix/video-ui-r12-2-status-colors-20260812
