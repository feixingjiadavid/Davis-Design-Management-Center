name: R12 Video UI Root Fix

on:
  push:
    branches:
      - fix/video-ui-r12-task-state-20260812

permissions:
  contents: write

jobs:
  fix-r12:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/video-ui-r12-task-state-20260812
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic R12 patch
        run: python3 scripts/r12_fix.py

      - name: Verify syntax and regressions
        run: |
          node --check seedance/app.js
          node --check seedance/r54-deliverables.js
          node --check seedance/a-ui-category-tools.js
          node --check seedance/r54-deliverables-core.mjs
          node --check supabase-config.js
          node --test seedance/r54-deliverables-core.test.mjs seedance/r54-import-normalization.test.mjs seedance/a-version-regression.test.mjs seedance/a-ui-mount.test.mjs
          git diff --check

      - name: Commit verified implementation when changed
        run: |
          if git diff --quiet; then
            echo "No runtime changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seedance/app.js seedance/r54-deliverables.js seedance/r54-deliverables-core.mjs seedance/a-ui-category-tools.js ai-assistant.html supabase-config.js
          git commit -m "fix(video): isolate child task status and stop sidebar rebuilds [r12-root-fixed]"
          git push origin HEAD:fix/video-ui-r12-task-state-20260812
