name: Davis Video A Version Check

on:
  push:
    branches:
      - feature/video-studio-a-architecture
      - feature/a-ui-mount-fix
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-a-version:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check A modules
        run: |
          node --check seedance/a-history-compat.js
          node --check seedance/a-ui-category-tools.js
          node --check seedance/r54-deliverables.js
          node --check seedance/r54-paid-safety.js
          node --check seedance/r54-tree-stability.js
          node --check seedance/r54-selection-tools.js
          node --check seedance/r54-cost-context.js
          node --check seedance/r54-architecture-ux.js
          node --check seedance/r54-deliverables-core.mjs
          node --check seedance/access-control.mjs
          node --check supabase-config.js

      - name: A-version unit tests
        run: |
          node --test seedance/r54-deliverables-core.test.mjs seedance/r54-import-normalization.test.mjs seedance/a-version-regression.test.mjs seedance/a-ui-mount.test.mjs seedance/r12-1-regression.test.mjs seedance/r12-2-status-regression.test.mjs seedance/r12-3-status-binding-regression.test.mjs seedance/access-control.test.mjs seedance/owner-isolation-regression.test.mjs seedance/r18-flat-tree-regression.test.mjs
