name: Seedance Edge tests

on:
  push:
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/seedance-edge-tests.yml'
  pull_request:
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/seedance-edge-tests.yml'

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Seedance pure module tests
        run: node --test supabase/functions/tests/*.test.mjs
