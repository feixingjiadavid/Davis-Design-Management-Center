name: One-time Video Label Cache Bump
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[label-cache-bump-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Force fresh app asset
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai-assistant.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('app.js?v=20260812-a-product-cleanup-2','app.js?v=20260812-labels-cn-1')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/video-label-cache-bump.yml
          git add ai-assistant.html
          git commit -m "fix(video): force refresh Chinese UI labels [label-cache-bump-done]"
          git push origin HEAD:main
