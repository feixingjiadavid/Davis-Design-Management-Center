name: One-time Video UI Label Cleanup
on:
  push:
    branches: [fix/video-label-cleanup-20260812]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[label-cleanup-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/video-label-cleanup-20260812
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch user-facing labels
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path('ai-assistant.html'), Path('seedance/app.js'), Path('seedance/app-v46.js')]
          replacements = [
              ('Storyboard Timeline', '分镜时间线'),
              ('高级 Storyboard', '编辑详情'),
              ('多帧 Storyboard', '多帧'),
              ('纯文字生成', '纯文字'),
          ]
          for p in files:
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              original = s
              for old, new in replacements:
                  s = s.replace(old, new)
              if s != original:
                  p.write_text(s, encoding='utf-8')
                  print('updated', p)
          PY
          git diff --check
          node --check seedance/app.js
          node --check seedance/app-v46.js
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-assistant.html seedance/app.js seedance/app-v46.js
          if git diff --cached --quiet; then
            echo "No label changes needed"
            exit 0
          fi
          git commit -m "fix(video): simplify Chinese UI labels [label-cleanup-done]"
          git push origin HEAD:fix/video-label-cleanup-20260812
