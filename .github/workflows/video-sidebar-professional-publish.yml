name: One-time Video Sidebar Professional Publish
on:
  push:
    paths:
      - '.github/workflows/video-sidebar-professional-publish.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and cache-bust assets
        run: |
          node --check seedance/a-ui-category-tools.js
          grep -q 'grid-template-areas:"name status" "meta meta"' seedance/a-ui-layout-fix.css
          grep -q '默认成片单元' seedance/a-ui-category-tools.js
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('ai-assistant.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'a-ui-layout-fix\.css\?v=[^"\']+', 'a-ui-layout-fix.css?v=20260812-professional-sidebar-1', s)
          s=re.sub(r'a-ui-category-tools\.js\?v=[^"\']+', 'a-ui-category-tools.js?v=20260812-professional-sidebar-1', s)
          p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/video-sidebar-professional-publish.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai-assistant.html .github/workflows/video-sidebar-professional-publish.yml
          git commit -m "fix(video): publish professional project sidebar"
          git push
