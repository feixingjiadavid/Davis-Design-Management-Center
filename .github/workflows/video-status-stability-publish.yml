name: One-time Video Status Stability Publish
on: push
permissions:
  contents: write
jobs:
  publish:
    if: "!contains(github.event.head_commit.message, '[status-stability-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch status save without tree rebuild
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('seedance/r54-deliverables.js')
          s = p.read_text(encoding='utf-8')
          old = "toast(next==='needs_retry'?'已标记需重做':'审核状态已更新',next==='needs_retry'?'这里只做人工标记，不会自动重新生成，也不会产生费用。':REVIEW_LABELS[next]);await loadData();document.querySelectorAll('.project-child-list').forEach(x=>delete x.dataset.r54);queueEnhance();}"
          new = "toast(next==='needs_retry'?'已标记需重做':'审核状态已更新',next==='needs_retry'?'这里只做人工标记，不会自动重新生成，也不会产生费用。':REVIEW_LABELS[next]);await loadData();}"
          if old not in s:
              raise SystemExit('setReview rebuild target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          sp = Path('supabase-config.js')
          x = sp.read_text(encoding='utf-8')
          x = x.replace("import('./seedance/r54-deliverables.js')", "import('./seedance/r54-deliverables.js?v=20260812-status-stable-1')")
          x = x.replace("import('./seedance/r54-deliverables.js?v=20260812-status-buttons-1')", "import('./seedance/r54-deliverables.js?v=20260812-status-stable-1')")
          sp.write_text(x, encoding='utf-8')

          hp = Path('ai-assistant.html')
          h = hp.read_text(encoding='utf-8')
          import re
          h = re.sub(r'supabase-config\.js\?v=[^\"\']+', 'supabase-config.js?v=20260812-status-stable-1', h)
          h = re.sub(r'a-ui-category-tools\.js\?v=[^\"\']+', 'a-ui-category-tools.js?v=20260812-status-stable-1', h)
          hp.write_text(h, encoding='utf-8')
          PY
      - name: Syntax check
        run: |
          node --check seedance/r54-deliverables.js
          node --check seedance/a-ui-category-tools.js
          node --check supabase-config.js
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/video-status-stability-publish.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add seedance/r54-deliverables.js seedance/a-ui-category-tools.js supabase-config.js ai-assistant.html .github/workflows/video-status-stability-publish.yml
          git commit -m 'fix(video): stable persisted status UI without tree flicker [status-stability-done]' || exit 0
          git push origin HEAD:main