name: One-time Video Task UI Cache Bump
on: push
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/video-task-cards-20260812
      - name: Bump resources
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai-assistant.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('a-ui-layout-fix.css?v=20260812-task-cards-1','a-ui-layout-fix.css?v=20260812-task-cards-status-2')
          s=s.replace('a-ui-category-tools.js?v=20260812-task-cards-1','a-ui-category-tools.js?v=20260812-task-cards-status-2')
          s=s.replace('a-ui-category-tools.js?v=20260812-real-dom-ui-1','a-ui-category-tools.js?v=20260812-task-cards-status-2')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/video-task-ui-cache-bump.yml .github/workflows/video-status-buttons.yml
      - name: Verify
        run: node --check seedance/a-ui-category-tools.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(video): publish task cards and three-state buttons' || exit 0
          git push origin HEAD:fix/video-task-cards-20260812
