name: One-time Video Real DOM UI Publish
on:
  push:
    paths:
      - '.github/workflows/video-ui-real-dom-publish.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and cache-bust
        run: |
          node --check seedance/a-ui-category-tools.js
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('ai-assistant.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'a-ui-layout-fix\.css\?v=[^"\']+', 'a-ui-layout-fix.css?v=20260812-real-dom-ui-1', s)
          s=re.sub(r'a-ui-category-tools\.js\?v=[^"\']+', 'a-ui-category-tools.js?v=20260812-real-dom-ui-1', s)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'real-dom-ui-1' ai-assistant.html
          rm .github/workflows/video-ui-real-dom-publish.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai-assistant.html .github/workflows/video-ui-real-dom-publish.yml
          git commit -m "fix(video): publish real DOM sidebar and status UI"
          git push
