<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Davis AI 设计师工作台</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--ink:#15233b;--muted:#71809a;--line:#e5ebf3;--blue:#3377ff;--green:#22a873;--amber:#e99a20;--red:#df5b68}*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 75% -10%,#dceaff 0,transparent 35%),var(--bg);color:var(--ink)}button{font:inherit}.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);background:#fffffff0;backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:12px}.logo{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#3377ff,#18bad3);color:white;font-weight:900;box-shadow:0 8px 20px #3377ff38}.brand b,.brand small{display:block}.brand small,.muted{color:var(--muted);font-size:11px}.online{font-size:12px;color:var(--green)}.online:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:8px;box-shadow:0 0 0 5px #22a87318}.layout{display:grid;grid-template-columns:310px minmax(500px,1fr) 380px;gap:16px;padding:16px;height:calc(100vh - 72px)}.panel{background:#fffffff2;border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px #5060800d;overflow:hidden}.head{padding:19px;border-bottom:1px solid var(--line)}.head h2{font-size:15px;margin:0 0 5px}.head p{font-size:11px;color:var(--muted);margin:0}.scroll{height:calc(100% - 72px);overflow:auto}.queue{padding:10px}.task{width:100%;text-align:left;border:1px solid transparent;background:transparent;padding:14px;border-radius:15px;margin-bottom:6px;cursor:pointer}.task:hover{background:#f6f9ff}.task.active{background:#edf4ff;border-color:#cfe0ff}.row{display:flex;justify-content:space-between;gap:8px}.id{font:700 10px ui-monospace;color:var(--blue)}.pill{font-size:10px;font-weight:700;padding:4px 7px;border-radius:99px;background:#eef2f7;color:#67748b}.task h3{font-size:13px;line-height:1.45;margin:9px 0}.meta{font-size:10px;color:var(--muted)}.work{padding:24px}.hero{display:flex;justify-content:space-between;gap:15px;margin-bottom:24px}.hero h1{font-size:22px;margin:5px 0 7px}.hero p{font-size:11px;color:var(--muted);margin:0}.retry{border:1px solid #cfe0ff;background:#f4f8ff;color:var(--blue);padding:9px 12px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;height:36px}.retry:disabled{opacity:.45}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:22px}.step{padding:11px 6px;border:1px solid var(--line);border-radius:13px;background:#fafbfd;text-align:center;min-height:82px}.num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;margin:0 auto 8px;background:#e9eef5;color:#8793a7;font-size:10px;font-weight:900}.step b{display:block;font-size:10px}.step small{display:block;font-size:9px;color:var(--muted);margin-top:4px}.step.done{background:#f0fbf7;border-color:#c8edde}.step.done .num{background:var(--green);color:white}.step.current{background:#eef5ff;border-color:#bfd5ff;box-shadow:0 8px 20px #3377ff12}.step.current .num{background:var(--blue);color:white}.step.wait .num{background:#fff2d8;color:#b8790a}.block{border-top:1px solid var(--line);padding:19px 0}.block-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.block h3{font-size:13px;margin:0}.state{font-size:10px;font-weight:800;color:var(--blue)}.content{font-size:12px;line-height:1.75;color:#43516a;white-space:pre-wrap}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#f1f5fa;border:1px solid #e2e8f0;color:#55647c;padding:6px 9px;border-radius:9px;font-size:10px}.warning{background:#fff9ec;border:1px solid #f4dfad;border-radius:13px;padding:12px;color:#79591d;font-size:11px;line-height:1.7}.artifact{padding:18px}.preview{aspect-ratio:4/5;border-radius:16px;border:1px dashed #cbd6e5;background:linear-gradient(145deg,#f5f9ff,#eef4fb);display:grid;place-items:center;text-align:center;padding:28px;color:var(--muted);font-size:12px}.preview strong{display:block;color:var(--ink);margin-bottom:8px}.artifact h3{font-size:13px;margin:19px 0 10px}.prompt{background:#17243a;color:#d8e5fb;border-radius:13px;padding:13px;font:10px/1.7 ui-monospace;max-height:175px;overflow:auto;white-space:pre-wrap}.primary{width:100%;border:0;background:#c8d1df;color:white;padding:13px;border-radius:12px;font-weight:800;font-size:12px;margin-top:14px}.note{text-align:center;color:var(--muted);font-size:9px;margin-top:8px}.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:12px}.error{color:var(--red)}
@media(max-width:1100px){.layout{grid-template-columns:270px 1fr;height:auto}.artifact-panel{grid-column:1/-1}.scroll{height:auto;max-height:700px}.artifact{display:grid;grid-template-columns:280px 1fr;gap:20px}}@media(max-width:720px){.layout{grid-template-columns:1fr}.flow{grid-template-columns:1fr 1fr}.artifact{display:block}}
</style></head><body>
<header class="top"><div class="brand"><div class="logo">AI</div><div><b>Davis AI 设计师</b><small>可视化执行工作台</small></div></div><div class="online">Agent 在线 · 15 秒刷新</div></header>
<main class="layout"><section class="panel"><div class="head"><h2>需求队列</h2><p id="count">正在读取任务...</p></div><div class="scroll queue" id="queue"></div></section>
<section class="panel"><div class="scroll work"><div class="hero"><div><span class="id" id="detail-id">请选择需求</span><h1 id="title">AI 尚未选中任务</h1><p id="detail-meta">从左侧查看当前执行进度</p></div><button class="retry" id="retry" disabled>重新分析</button></div><div class="flow" id="flow"></div><div id="analysis"></div></div></section>
<section class="panel artifact-panel"><div class="head"><h2>当前产物</h2><p>方案与生成提示词实时预览</p></div><div class="scroll artifact"><div class="preview" id="preview"><div><strong>尚未形成方案预览</strong>AI 完成需求分析后，将在这里生成并上传框架方案。</div></div><div><h3>生成提示词</h3><div class="prompt" id="prompt">等待 AI 生成...</div><button class="primary" id="generate" disabled>等待分析完成</button><div class="note">付费生成必须由人工主动批准</div></div></div></section></main>
<script type="module">
import{ supabase }from'./supabase-config.js';const{data:sessionData}=await supabase.auth.getSession();const signedInUser=sessionData?.session?.user;const signedInName=String(signedInUser?.user_metadata?.enName||signedInUser?.email?.split('@')[0]||'').toLowerCase();if(!signedInUser){location.replace('login.html?redirect='+encodeURIComponent(location.href));throw new Error('Authentication required')}if(signedInName!=='davis.design.ai'){location.replace((signedInUser.user_metadata?.perms||[]).includes('design')?'assistant-workspace.html':'index.html');throw new Error('AI workspace access denied')}const $=x=>document.getElementById(x);let jobs=[],selected=null;const labels={queued:'排队中',analyzing:'分析中',needs_input:'信息不足',ready_for_generation:'等待人工批准',failed:'执行失败'};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stage=s=>s==='queued'?0:s==='analyzing'?1:s==='failed'?1:s==='needs_input'?2:3;
function renderQueue(){$('count').textContent=`${jobs.length} 个 AI 任务`;$('queue').innerHTML=jobs.length?jobs.map(j=>`<button class="task ${selected?.id===j.id?'active':''}" data-id="${j.id}"><div class="row"><span class="id">${esc(j.task_id)}</span><span class="pill">${labels[j.status]||j.status}</span></div><h3>${esc(j.request_snapshot?.title||'未命名需求')}</h3><div class="row meta"><span>${esc(j.request_snapshot?.project||'未分类')}</span><span>${new Date(j.updated_at).toLocaleString()}</span></div></button>`).join(''):'<div class="empty">暂时没有分配给 AI 的设计需求</div>';document.querySelectorAll('.task').forEach(b=>b.onclick=()=>select(b.dataset.id))}
function renderDetail(){if(!selected)return;const a=selected.analysis||{},s=stage(selected.status);$('detail-id').textContent=selected.task_id;$('title').textContent=selected.request_snapshot?.title||'未命名需求';$('detail-meta').textContent=`${selected.request_snapshot?.creator||'需求方'} · ${selected.request_snapshot?.project||'未分类'} · ${new Date(selected.updated_at).toLocaleString()}`;$('retry').disabled=selected.status==='analyzing';const steps=[['接收需求','进入 AI 队列'],['需求分析','提取约束'],['生成方案','形成框架'],['上传方案','原审批流程'],['付费生成','人工批准']];$('flow').innerHTML=steps.map((x,i)=>`<div class="step ${i<s?'done':i===s?'current':i===4?'wait':''}"><div class="num">${i<s?'✓':i+1}</div><b>${x[0]}</b><small>${x[1]}</small></div>`).join('');const missing=a.missing_fields||[];$('analysis').innerHTML=`<div class="block"><div class="block-title"><h3>AI 需求理解</h3><span class="state ${selected.status==='failed'?'error':''}">${labels[selected.status]||selected.status}</span></div><div class="content">${esc(a.task_type?`任务类型：${a.task_type}\n设计模式：${a.design_mode||'待判断'}\n交付内容：${(a.deliverables||[]).join('、')}`:'AI 正在读取需求并形成结构化理解。')}</div></div><div class="block"><div class="block-title"><h3>执行计划</h3></div><div class="chips">${(a.execution_plan||[]).map(x=>`<span class="chip">${esc(typeof x==='string'?x:JSON.stringify(x))}</span>`).join('')||'<span class="muted">等待生成...</span>'}</div></div>${missing.length?`<div class="block"><div class="block-title"><h3>方案中需明确的资料</h3></div><div class="warning">${missing.map((x,i)=>`${i+1}. ${esc(x)}`).join('<br>')}<br><br>这些内容将写入 AI 上传的框架方案，交由原审批节点处理。</div></div>`:''}${selected.error_message?`<div class="block error">${esc(selected.error_message)}</div>`:''}`;$('prompt').textContent=a.generation_prompt||a.prompt||'需求分析完成后生成。';$('generate').textContent=selected.status==='ready_for_generation'?'生成并上传方案（下一步接入）':'等待分析完成'}
function select(id){selected=jobs.find(j=>j.id===id);renderQueue();renderDetail()}async function load(){const{data,error}=await supabase.from('ai_design_jobs').select('*').order('updated_at',{ascending:false});if(error){$('queue').innerHTML=`<div class="empty error">${esc(error.message)}</div>`;return}jobs=data||[];selected=selected?jobs.find(j=>j.id===selected.id)||jobs[0]:jobs[0];renderQueue();renderDetail()}$('retry').onclick=async()=>{if(!selected)return;$('retry').disabled=true;$('retry').textContent='分析中...';await supabase.functions.invoke('ai-design-analyze',{body:{task_id:selected.task_id}});$('retry').textContent='重新分析';await load()};await load();setInterval(()=>document.visibilityState==='visible'&&load(),15000);
</script></body></html>
